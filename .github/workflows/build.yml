name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Instalar plataforma Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Compilar el APK
        run: gradle assembleDebug --no-daemon

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: MichaelFF-APK
          path: app/build/outputs/apk/debug/*.apk
